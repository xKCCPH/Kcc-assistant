<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCC Bible Study Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        .chat-box { height: 400px; border: 1px solid #ddd; border-radius: 5px; padding: 10px; overflow-y: scroll; margin-bottom: 15px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 5px; max-width: 80%; line-height: 1.4; }
        .user { background: #007bff; color: white; margin-left: auto; text-align: right; }
        .bot { background: #e9ecef; color: #333; margin-right: auto; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>👑 KCC Bible Assistant</h2>
    <div class="chat-box" id="chatBox">
        <div class="message bot">Magandang araw! Ako ang iyong KCC Assistant. Magtanong na po kayo tungkol sa ating mga aralin .</div>
    </div>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="Magtanong dito..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">I-send</button>
    </div>
</div>

<script>
    // ILAGAY DITO SA LOOB NG QUOTATION MARKS ANG API KEY MO
    const API_KEY = "AQ.Ab8RN6LgXxmwhGxYJFB8YNS7qrfikpzIG9v2jBAKjCWlOc9MBw"; 

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const userText = inputField.value.trim();
        
        if (!userText) return;

        chatBox.innerHTML += `<div class="message user">${userText}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const systemInstruction = "Mahigpit na Patakaran: Huwag na huwag kang magse-search sa Google o gagamit ng panlabas na kaalaman. Ang tanging pagkukunan mo ng sagot ay ang mga aralin ng Kingdom Community Center (KCC). Kung ang sagot ay wala sa aralin, sabihin mong 'Wala po ito sa ating opisyal na aralin.'";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [
                        { role: "user", parts: [{ text: systemInstruction + "\n\nTanong ng miyembro: " + userText }] }
                    ]
                })
            });

            const data = await response.json();
            const botReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Pasensya na, nagka-error sa koneksyon.";

            chatBox.innerHTML += `<div class="message bot">${botReply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            chatBox.innerHTML += `<div class="message bot">May nangyaring error sa pagproseso.</div>`;
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
