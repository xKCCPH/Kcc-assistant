<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCC Bible Study Assistant</title>
    <style>
        :root {
            --base-font-size: 16px;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f4f8; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
        }
        .container { 
            width: 100%; 
            max-width: 700px; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.08); 
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        h2 { 
            color: #1e3a8a; 
            margin: 0; 
            font-size: calc(var(--base-font-size) + 6px);
        }
        .font-controls {
            display: flex;
            gap: 6px;
        }
        .font-btn {
            background: #e2e8f0;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #334155;
            transition: background 0.2s;
        }
        .font-btn:hover { background: #cbd5e1; }
        .chat-box { 
            height: 450px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            padding: 15px; 
            overflow-y: scroll; 
            margin-bottom: 15px; 
            background: #f8fafc; 
        }
        .message { 
            margin-bottom: 12px; 
            padding: 12px 16px; 
            border-radius: 8px; 
            max-width: 85%; 
            line-height: 1.5; 
            font-size: var(--base-font-size);
        }
        .user { 
            background: #2563eb; 
            color: white; 
            margin-left: auto; 
            text-align: right; 
        }
        .bot { 
            background: #e2e8f0; 
            color: #0f172a; 
            margin-right: auto; 
        }
        .input-group { 
            display: flex; 
            gap: 10px; 
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            outline: none; 
            font-size: var(--base-font-size);
        }
        input:focus { border-color: #2563eb; }
        button.send-btn { 
            padding: 12px 24px; 
            background: #16a34a; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: var(--base-font-size);
            font-weight: bold;
            transition: background 0.2s;
        }
        button.send-btn:hover { background: #15803d; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h2>👑 KCC Bible Assistant</h2>
        <div class="font-controls">
            <button class="font-btn" onclick="adjustFontSize(-2)" title=" Paliitin ang Letter">A-</button>
            <button class="font-btn" onclick="adjustFontSize(2)" title=" Lakihan ang Letter">A+</button>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">Magandang araw! Ako ang iyong KCC Assistant. Magtanong na po kayo tungkol sa ating mga aralin (tulad ng Hermeneutics).</div>
    </div>
    
    <div class="input-group">
        <input type="text" id="userInput" placeholder="Magtanong dito..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">I-send</button>
    </div>
</div>

<script>
    // ILAGAY DITO ANG API KEY MO SA LOOB NG QUOTATION MARKS
    const API_KEY = "AQ.Ab8RN6LgXxmwhGxYJFB8YNS7qrfikpzIG9v2jBAKjCWlOc9MBw"; 

    let currentSize = 16;
    function adjustFontSize(change) {
        currentSize += change;
        if (currentSize < 12) currentSize = 12; // Limit sa pinakamaliit
        if (currentSize > 24) currentSize = 24; // Limit sa pinakamalaki
        document.documentElement.style.setProperty('--base-font-size', currentSize + 'px');
    }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const userText = inputField.value.trim();
        
        if (!userText) return;

        chatBox.innerHTML += `<div class="message user">${userText}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const systemInstruction = "Mahigpit na Patakaran: Huwag na huwag kang magse-search sa Google o gagamit ng panlabas na kaalaman. Ang tanging pagkukunan mo ng sagot ay ang mga aralin ng Kingdom Community Center (KCC) tungkol sa Hermeneutics at Biblia. Kung ang sagot ay wala sa aralin, sabihin mong 'Wala po ito sa ating opisyal na aralin.'";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [
                        { role: "user", parts: [{ text: systemInstruction + "\n\nTanong ng miyembro: " + userText }] }
                    ]
                })
            });

            const data = await response.json();
            const botReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Pasensya na, wala pang ganyang information na pumasok sa akin. maaring mag tanong kay Kuya Pastor Jec, kay Tatay Pastor Libby sa ibang Member ng Community.";

            chatBox.innerHTML += `<div class="message bot">${botReply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            chatBox.innerHTML += `<div class="message bot">May nangyaring error sa pagproseso.</div>`;
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
