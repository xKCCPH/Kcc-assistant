<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCC Bible Assistant</title>
    <style>
        :root {
            --base-font-size: 15px;
            --primary-color: #0f172a;
            --accent-color: #d97706;
            --bg-color: #f8fafc;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
        }
        .app-container { 
            width: 100%; 
            max-width: 800px; 
            background: #ffffff; 
            border-radius: 16px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1); 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .app-header {
            background: #0f172a;
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent-color);
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-title h2 { 
            margin: 0; 
            font-size: calc(var(--base-font-size) + 5px);
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header-title span {
            font-size: 24px;
        }
        .font-controls {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px;
            border-radius: 8px;
        }
        .font-btn {
            background: transparent;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: #e2e8f0;
            font-size: 13px;
            transition: all 0.2s;
        }
        .font-btn:hover { background: rgba(255, 255, 255, 0.2); color: white; }
        
        .chat-box { 
            height: 480px; 
            padding: 24px; 
            overflow-y: auto; 
            background: #f8fafc; 
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message { 
            padding: 14px 18px; 
            border-radius: 12px; 
            max-width: 80%; 
            line-height: 1.6; 
            font-size: var(--base-font-size);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            white-space: pre-wrap;
        }
        .user { 
            background: #2563eb; 
            color: white; 
            margin-left: auto; 
            border-bottom-right-radius: 2px;
        }
        .bot { 
            background: white; 
            color: #334155; 
            margin-right: auto; 
            border-bottom-left-radius: 2px;
            border: 1px solid #e2e8f0;
        }
        .loading-spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .input-section {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        input { 
            flex: 1; 
            padding: 14px 18px; 
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            outline: none; 
            font-size: var(--base-font-size);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { 
            border-color: #2563eb; 
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button.send-btn { 
            padding: 14px 24px; 
            background: #0f172a; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: var(--base-font-size);
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }
        button.send-btn:hover { background: #1e293b; }
        button.send-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <div class="header-title">
            <span>👑</span>
            <h2>KCC Bible Assistant</h2>
        </div>
        <div class="font-controls">
            <button class="font-btn" onclick="adjustFontSize(-1)" title="Paliitin ang Font">A-</button>
            <button class="font-btn" onclick="adjustFontSize(1)" title="Lakihan ang Font">A+</button>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">Magandang araw po! Ako ang iyong KCC Assistant. Masaya ko kayong matutulungan at maipapaliwanag ang mga aralin tungkol sa Kaharian ng Diyos. Ano po ang gusto ninyong malaman o itanong ngayon?</div>
    </div>
    
    <div class="input-section">
        <input type="text" id="userInput" placeholder="Magtanong dito tungkol sa aralin o sa Vision/Mission..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">I-send</button>
    </div>
</div>

<script>
    let currentSize = 15;
    function adjustFontSize(change) {
        currentSize += change;
        if (currentSize < 13) currentSize = 13;
        if (currentSize > 20) currentSize = 20;
        document.documentElement.style.setProperty('--base-font-size', currentSize + 'px');
    }

    const KCC_DATABASE = `
    OPISYAL NA MGA ARALIN AT IMPORMASYON NG KCC:

    1. VISION OF THE KINGDOM OF GOD:
    - Definition: Vision = The Creator-King's ultimate goal for His creation.
    - VISION: A restored creation under the full rule of God where His will is perfectly done on earth as it is in heaven, with mankind reigning as His royal sons and ambassadors.
    - BIBLICAL REFERENCES: Genesis 1:26-28, Psalm 24:1, Daniel 7:27, Habakkuk 2:14, Revelations 21-22

    2. MISSION OF THE KINGDOM OF GOD:
    - Definition: Mission = The ongoing assignment to bring the King's vision to reality.
    - MISSION: To make the Kingdom visible on earth by restoring people to the rule of God through the gospel of the Kingdom, discipleship, and the demonstration of Kingdom culture.
    - BIBLICAL REFERENCES: Matthew 4:17, Luke 4:43, Matthew 28:18-20, Matthew 6:33, Acts 1:3, Acts 1:8
    `;

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const sendBtn = document.getElementById("sendBtn");
        const userText = inputField.value.trim();
        
        if (!userText) return;

        chatBox.innerHTML += `<div class="message user">${userText}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        inputField.disabled = true;
        sendBtn.disabled = true;

        const loadingId = "loading-" + Date.now();
        chatBox.innerHTML += `<div class="message bot" id="${loadingId}">Nag-iisip at nagpapaliwanag <span class="loading-spinner">⏳</span></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        setTimeout(() => {
            const loadingElem = document.getElementById(loadingId);
            if (loadingElem) loadingElem.remove();

            let reply = "";
            const query = userText.toLowerCase();

            if (query.includes("vision") || query.includes("layunin")) {
                reply = `Magandang tanong po! Tungkol sa "Vision ng Kaharian ng Diyos", ito po ay ang pangunahing layunin ng Creator-King para sa Kanyang nilikha. \n\nIto ay ang "isang naibalik na nilikha sa ilalim ng ganap na pamamahala ng Diyos", kung saan ang Kanyang kalooban ay perpektong nagaganap dito sa lupa tulad ng sa langit, habang ang tao ay namamahala bilang Kanyang mga anak at ambassador (Genesis 1:26-28; Awit 24:1). May gusto pa po ba kayong linawin tungkol dito?`;
            } 
            else if (query.includes("mission") || query.includes("misyon")) {
                reply = `Maganda pong pag-usapan ang "Mission ng Kaharian ng Diyos"! Ang misyon po ay ang patuloy na gawain upang maisakatuparan ang vision ng Hari.\n\nIbig sabihin nito, "ginagawa nating nakikita ang Kaharian dito sa lupa" sa pamamagitan ng pagbabalik sa mga tao sa pamamahala ng Diyos sa pamamagitan ng Ebanghelyo, pagdidisipulo, at pagpapakita ng kultura ng Kaharian (Mateo 4:17; Mateo 28:18-20). May partikular po ba kayong gustong malaman kung paano natin ito isinasabuhay?`;
            }
            else if (query.includes("pagsisi") || query.includes("citizen") || query.includes("maging citizen")) {
                reply = `Para po maging ganap na citizen ng Kaharian ng Diyos ayon sa ating mga aralin, kailangan po tayong ipanganak muli sa tubig at sa Espiritu (Juan 3). \n\nNarito po ang mga hakbang sa pagsisisi na maaari nating gabay:\n1. Kilalanin na tayo ay nagkasala laban sa Diyos.\n2. Unawain na ang kabayaran ng kasalanan ay kamatayan, ngunit ang regalo ng Diyos ay buhay na walang hanggan.\n3. Manampalataya kay Hesus at isuko ang mga maling pamumuhay (Lucas 13:3).\n4. Tanggapin si Hesus bilang Panginoon at Tagapagligtas ng ating buhay (Roma 10:9-10). \n\nMay gusto po ba kayong itanong tungkol sa hakbang na ito?`;
            }
            else if (query.includes("espiritu") || query.includes("parakletos") || query.includes("banal na espiritu")) {
                reply = `Napakahalagang bahagi ng ating buhay ang Banal na Espiritu. Siya po ang tinatawag na "Parakletos" - ang ating Legal Assistant, Tagapagtanggol, at Counsel sa gitna ng mga pagsubok.\n\nAng tatlo sa Kanyang pangunahing gawain ay:\n- Magtuturo ng lahat ng bagay tungkol kay Hesus.\n- Magpapaalala sa atin ng mga itinuro at sinabi Niya.\n- Patuloy na gagabay sa atin araw-araw.\n\nBilang tugon, tinatawag din tayong maging 'asin' at 'liwanag' sa mundong ito. May nais po ba kayong idagdag o itanong pa tungkol dito?`;
            }
            else {
                reply = `Maraming salamat sa iyong tanong! Ayon sa ating mga opisyal na aralin at materyal, ang paksang ito ay nagtuturo sa atin ng kahalagahan ng pagpapasakop at pamumuhay sa ilalim ng Kaharian ng Diyos.\n\nBagamat maari kang magtanong tungkol sa "Vision, Mission, Pagsisisi, o Banal na Espiritu", narito po ako upang gabayan ka. May gusto ka bang ituloy na partikular na bahagi ng aralin?`;
            }

            chatBox.innerHTML += `<div class="message bot">${reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            
            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
        }, 800);
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
