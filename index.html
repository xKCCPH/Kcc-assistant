<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCC Bible Study Assistant</title>
    <style>
        :root {
            --base-font-size: 15px;
            --primary-color: #0f172a;
            --accent-color: #d97706;
            --bg-color: #f8fafc;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
        }
        .app-container { 
            width: 100%; 
            max-width: 800px; 
            background: #ffffff; 
            border-radius: 16px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1); 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .app-header {
            background: #0f172a;
            color: white;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent-color);
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-title h2 { 
            margin: 0; 
            font-size: calc(var(--base-font-size) + 5px);
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header-title span {
            font-size: 24px;
        }
        .font-controls {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px;
            border-radius: 8px;
        }
        .font-btn {
            background: transparent;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: #e2e8f0;
            font-size: 13px;
            transition: all 0.2s;
        }
        .font-btn:hover { background: rgba(255, 255, 255, 0.2); color: white; }
        
        .chat-box { 
            height: 480px; 
            padding: 24px; 
            overflow-y: auto; 
            background: #f8fafc; 
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message { 
            padding: 14px 18px; 
            border-radius: 12px; 
            max-width: 80%; 
            line-height: 1.6; 
            font-size: var(--base-font-size);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            white-space: pre-wrap;
        }
        .user { 
            background: #2563eb; 
            color: white; 
            margin-left: auto; 
            border-bottom-right-radius: 2px;
        }
        .bot { 
            background: white; 
            color: #334155; 
            margin-right: auto; 
            border-bottom-left-radius: 2px;
            border: 1px solid #e2e8f0;
        }

        .loading-spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .input-section {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        input { 
            flex: 1; 
            padding: 14px 18px; 
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            outline: none; 
            font-size: var(--base-font-size);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { 
            border-color: #2563eb; 
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button.send-btn { 
            padding: 14px 24px; 
            background: #0f172a; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: var(--base-font-size);
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }
        button.send-btn:hover { background: #1e293b; }
        button.send-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <div class="header-title">
            <span>👑</span>
            <h2>KCC Bible Assistant</h2>
        </div>
        <div class="font-controls">
            <button class="font-btn" onclick="adjustFontSize(-1)" title="Paliitin ang Font">A-</button>
            <button class="font-btn" onclick="adjustFontSize(1)" title="Lakihan ang Font">A+</button>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">Magandang araw! Ako ang iyong KCC Assistant. Ano ang maipaglilingkod ko sa iyo ngayon?</div>
    </div>
    
    <div class="input-section">
        <input type="text" id="userInput" placeholder="Magtanong dito..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">I-send</button>
    </div>
</div>

<script>
    // OpenRouter API Key
    const OPENROUTER_API_KEY = "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";

    let currentSize = 15;
    function adjustFontSize(change) {
        currentSize += change;
        if (currentSize < 13) currentSize = 13;
        if (currentSize > 20) currentSize = 20;
        document.documentElement.style.setProperty('--base-font-size', currentSize + 'px');
    }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const sendBtn = document.getElementById("sendBtn");
        const userText = inputField.value.trim();
        
        if (!userText) return;

        chatBox.innerHTML += `<div class="message user">${userText}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        inputField.disabled = true;
        sendBtn.disabled = true;

        const loadingId = "loading-" + Date.now();
        chatBox.innerHTML += `<div class="message bot" id="${loadingId}">Nag-iisip <span class="loading-spinner">⏳</span></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        // System Instruction na naglalaman ng Vision at Mission
        const systemInstruction = `
Ikaw ay isang matulungin at magalang na AI Assistant. Kapag nagtanong ang user tungkol sa Vision, Mission, o pareho tungkol sa Kingdom of God, ibigay mo ang sumusunod na eksaktong impormasyon:

--- VISION OF THE KINGDOM OF GOD ---
Definition: Vision = The Creator-King's ultimate goal for His creation.
VISION: A restored creation under the full rule of God where His will is perfectly done on earth as it is in heaven, with mankind reigning as His royal sons and ambassadors.
BIBLICAL REFERENCES: Genesis 1:26-28, Psalm 24:1, Daniel 7:27, Habakkuk 2:14, Revelations 21-22

--- MISSION OF THE KINGDOM OF GOD ---
Definition: Mission = The ongoing assignment to bring the King's vision to reality.
MISSION: To make the Kingdom visible on earth by restoring people to the rule of God through the gospel of the Kingdom, discipleship, and the demonstration of Kingdom culture.
BIBLICAL REFERENCES: Matthew 4:17, Luke 4:43, Matthew 28:18-20, Matthew 6:33, Acts 1:3, Acts 1:8
------------------------------------

Sagutin ang iba pang mga pangkalahatang tanong nang malinaw at maayos sa wikang Tagalog o Ingles depende sa tanong ng user.
`;

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                    "HTTP-Referer": window.location.href,
                    "X-Title": "KCC Bible Assistant"
                },
                body: JSON.stringify({
                    model: "meta-llama/llama-3.1-8b-instruct:free",
                    messages: [
                        { role: "system", content: systemInstruction },
                        { role: "user", content: userText }
                    ],
                    temperature: 0.3
                })
            });

            const data = await response.json();
            
            const loadingElem = document.getElementById(loadingId);
            if (loadingElem) loadingElem.remove();

            if (data.error) {
                chatBox.innerHTML += `<div class="message bot">May error sa API: ${data.error.message}</div>`;
            } else {
                const botReply = data.choices?.[0]?.message?.content || "Pasensya na, walang maibigay na sagot.";
                chatBox.innerHTML += `<div class="message bot">${botReply}</div>`;
            }
            
        } catch (error) {
            const loadingElem = document.getElementById(loadingId);
            if (loadingElem) loadingElem.remove();
            chatBox.innerHTML += `<div class="message bot">May problema sa koneksyon. Paki-subukan ulit.</div>`;
        } finally {
            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
