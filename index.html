<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdom Community Center | Official Portal</title>
    <style>
        :root {
            --bg-deep: #0b0f19;
            --bg-card: #151d30;
            --border-color: #2a364f;
            --accent-gold: #fbbf24;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(21, 29, 48, 0.85);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        /* MAJESTIC HEADER */
        header {
            text-align: center;
            padding: 45px 30px;
            background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #3b82f6, #fbbf24, #3b82f6);
        }

        .badge {
            display: inline-block;
            background: rgba(251, 191, 36, 0.15);
            color: var(--accent-gold);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        header h1 { 
            margin: 0 0 10px 0; 
            font-size: 2.8rem; 
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        header p { 
            margin: 0 0 30px 0; 
            color: var(--text-muted); 
            font-size: 1.15rem;
        }

        /* MAJESTIC ACTION BUTTONS */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .majestic-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 26px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-pdf {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: white;
            border: 1px solid rgba(251, 191, 36, 0.4);
        }

        .btn-pdf:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(217, 119, 6, 0.5);
        }

        .btn-fb {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .btn-fb:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
        }

        /* STATS METRICS ROW */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .metric-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: rgba(59, 130, 246, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--accent-blue);
        }

        .metric-info h4 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .metric-info p {
            margin: 2px 0 0 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* SEARCH BAR */
        .search-container {
            margin-bottom: 35px;
        }

        .search-input {
            width: 100%;
            padding: 18px 24px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .search-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        /* SECTION TITLES */
        .section-title {
            color: var(--text-main);
            font-size: 1.35rem;
            border-left: 4px solid var(--accent-gold);
            padding-left: 14px;
            margin: 40px 0 20px 0;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        /* MODULES & CARDS GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 26px;
            transition: all 0.25s ease;
            position: relative;
        }

        .card:hover { 
            transform: translateY(-4px); 
            border-color: var(--accent-blue);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent
